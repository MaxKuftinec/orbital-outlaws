name: Orbital Outlaws CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbital_test
          POSTGRES_PASSWORD: orbital_test
          POSTGRES_DB: orbital_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orbital_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://orbital_test:orbital_test@localhost:5432/orbital_test
      TEST_DATABASE_URL: postgresql+psycopg://orbital_test:orbital_test@localhost:5432/orbital_test
      ORBITAL_DEV_COMMANDS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Python and PostgreSQL tests
        working-directory: backend
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Node regression tests
        run: node --test tests/*.test.cjs
      - name: Build Vue cockpit
        working-directory: frontend
        run: npm ci && npm run build
